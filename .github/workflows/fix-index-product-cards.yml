name: Fix index product cards
on:
  push:
    paths:
      - '.github/workflows/fix-index-product-cards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch index product card visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* PRODUCT CARD MOBILE POLISH 20260905 */'
          if marker not in s:
              css='''\n/* PRODUCT CARD MOBILE POLISH 20260905 */\n.product-card.sake .app-icon-wrap{background:#0d0d0b}\n.product-card.sake .app-icon-wrap img{transform:scale(1.28);transform-origin:50% 34%}\n@media(max-width:680px){\n  .product-card{grid-template-columns:84px 1fr;gap:16px 14px;padding:22px 18px 20px;align-items:start}\n  .app-icon-wrap{width:78px;height:78px;border-radius:20px;align-self:start}\n  .product-name{padding-top:2px;padding-right:12px}\n  .product-name h3{font-size:29px;line-height:1.05;margin:0 0 6px}\n  .product-name span{display:block;font-size:9px;line-height:1.4;margin-bottom:8px}\n  .product-copy{font-size:13px;line-height:1.72}\n  .product-preview{grid-column:1/-1;height:145px;margin-top:4px}\n  .arrow{position:absolute;right:22px;bottom:16px;font-size:27px}\n  .product-card{padding-bottom:54px}\n  .product-card:before{width:170px;height:170px;right:18px;top:-92px}\n  .product-card.sake .app-icon-wrap img{transform:scale(1.34);transform-origin:50% 32%}\n}\n'''
              s=s.replace('</style>', css+'</style>',1)
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "genki0120"
          git config user.email "igagenki@outlook.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Polish mobile product cards on TENKI index [skip ci]"
          git push
