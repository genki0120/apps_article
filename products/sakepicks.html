function setLang(lang){if(!copy[lang])lang='en';document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=copy[lang][el.dataset.i18n]||'');document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));localStorage.setItem('sake-lang',lang)}document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));const q=new URLSearchParams(location.search).get('lang'),saved=localStorage.getItem('sake-lang'),browser=(navigator.language||'en').slice(0,2);setLang(q||saved||(copy[browser]?browser:'en'));const topbar=document.getElementById('topbar');addEventListener('scroll',()=>topbar.classList.toggle('scrolled',scrollY>15),{passive:true});const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach(e=>io.observe(e));const form=document.getElementById('form'),btn=document.getElementById('submit'),ok=document.getElementById('ok'),ng=document.getElementById('ng');form.addEventListener('submit',async e=>{e.preventDefault();ok.classList.remove('show');ng.classList.remove('show');btn.disabled=true;const lang=document.documentElement.lang,old=btn.textContent;btn.textContent='…';try{const r=await fetch('https://api.web3forms.com/submit',{method:'POST',body:new FormData(form)}),j=await r.json();if(r.ok&&j.success){ok.textContent=copy[lang].success;ok.classList.add('show');form.reset()}else throw new Error()}catch(_){ng.textContent=copy[lang].error;ng.classList.add('show')}finally{btn.disabled=false;btn.textContent=old}});
